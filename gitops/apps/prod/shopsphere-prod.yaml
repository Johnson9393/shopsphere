apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-prod
  namespace: prod-argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Johnson9393/shopsphere.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Johnson9393/shopsphere.git
      targetRevision: main
      path: helm/shopsphere
      helm:
        valueFiles:
          - $values/environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shopsphere-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
