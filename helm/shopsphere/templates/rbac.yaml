{{- $root := . }}
{{- $accounts := list "product-service" "user-service" "cart-service" "order-service" "payment-service" "notification-service" "api-gateway" "frontend" }}
{{- range $name := $accounts }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "shopsphere.namespace" $root }}
  labels:
    {{- include "shopsphere.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ $name }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "shopsphere.namespace" $root }}
  labels:
    {{- include "shopsphere.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "shopsphere.namespace" $root }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
{{- end }}
