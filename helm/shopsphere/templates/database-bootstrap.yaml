{{- $appLogin := true }}
{{- $sharedCluster := has .Values.global.environment (list "dev" "qa" "uat") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shopsphere.fullname" . }}-create-databases
  namespace: {{ include "shopsphere.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-20"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: create-databases
          image: postgres:15-alpine
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ ternary "aurora-admin" "aurora-credentials" $appLogin }}
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ ternary "aurora-admin" "aurora-credentials" $appLogin }}
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ ternary "aurora-admin" "aurora-credentials" $appLogin }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ternary "aurora-admin" "aurora-credentials" $appLogin }}
                  key: password
            - name: PGDATABASE
              value: postgres
            {{- if $appLogin }}
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: aurora-credentials
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aurora-credentials
                  key: password
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              prefix="{{ .Values.global.environment }}"
              {{ if $appLogin }}
              if [ "$APP_USER" = "$PGUSER" ]; then
                echo "Application user matches the master user." >&2
                exit 1
              fi
              psql -v ON_ERROR_STOP=1 -v app_user="$APP_USER" -v app_password="$APP_PASSWORD" -tA -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') THEN format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password') ELSE format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') END" | psql -v ON_ERROR_STOP=1 -f -
              {{ end }}
              for suffix in products users orders payments; do
                name="${prefix}_${suffix}"
                exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${name}'")
                if [ "$exists" != "1" ]; then
                  {{ if $appLogin }}
                  psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${name} OWNER ${APP_USER}"
                  {{ else }}
                  psql -c "CREATE DATABASE ${name}"
                  {{ end }}
                fi
                {{ if $appLogin }}
                psql -v ON_ERROR_STOP=1 -c "ALTER DATABASE ${name} OWNER TO ${APP_USER}"
                psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE ${name} FROM PUBLIC"
                psql -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE ${name} TO ${APP_USER}"
                psql -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE ${name} TO ${PGUSER}"
                psql -v ON_ERROR_STOP=1 -d "$name" -c "ALTER SCHEMA public OWNER TO ${APP_USER}"
                {{ end }}
              done
              {{ if $sharedCluster }}
              for other in dev qa uat; do
                if [ "$other" = "$prefix" ]; then
                  continue
                fi
                for suffix in products users orders payments; do
                  other_name="${other}_${suffix}"
                  exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${other_name}'")
                  if [ "$exists" = "1" ]; then
                    psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE ${other_name} FROM ${APP_USER}"
                  fi
                done
              done
              {{ end }}
