{{- $accounts := list "product-service" "user-service" "cart-service" "order-service" "payment-service" "notification-service" "api-gateway" "frontend" }}
{{- range $accounts }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ include "shopsphere.namespace" $ }}
  labels:
    {{- include "shopsphere.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
  {{- if eq . "notification-service" }}
  {{- with $.Values.services.notificationService.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
automountServiceAccountToken: {{ eq . "notification-service" }}
---
{{- end }}
