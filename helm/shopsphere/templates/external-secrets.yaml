apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurora-credentials
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-30"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shopsphere
    kind: ClusterSecretStore
  target:
    name: aurora-credentials
  dataFrom:
    {{- if has .Values.global.environment (list "dev" "qa" "uat") }}
    - extract:
        key: shopsphere/nonprod/aurora-connection
    {{- else }}
    - extract:
        key: shopsphere/{{ .Values.global.environment }}/aurora-connection
    {{- end }}
    - extract:
        key: shopsphere/{{ .Values.global.environment }}/aurora
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aurora-admin
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-30"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shopsphere
    kind: ClusterSecretStore
  target:
    name: aurora-admin
  dataFrom:
    {{- if has .Values.global.environment (list "dev" "qa" "uat") }}
    - extract:
        key: shopsphere/nonprod/aurora-connection
    {{- else }}
    - extract:
        key: shopsphere/{{ .Values.global.environment }}/aurora-connection
    {{- end }}
    - find:
        name:
          regexp: "^rds!cluster-"
