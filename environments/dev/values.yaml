global:
  environment: dev
  namespace: shopsphere-dev
  awsRegion: us-east-1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

services:
  productService:
    env:
      PRODUCT_DB_NAME: dev_products
      PRODUCT_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-product-service
      tag: "1.0.0"
  userService:
    env:
      USER_DB_NAME: dev_users
      USER_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-user-service
      tag: "1.0.0"
  cartService:
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-cart-service
      tag: "1.0.0"
  orderService:
    env:
      ORDER_DB_NAME: dev_orders
      ORDER_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-order-service
      tag: "1.0.0"
  paymentService:
    env:
      PAYMENT_DB_NAME: dev_payments
      PAYMENT_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-payment-service
      tag: "1.0.0"
  notificationService:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::071138597726:role/dev-shopsphere-notification
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-notification-service
      tag: "1.0.0"

apiGateway:
  image:
    repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-api-gateway
    tag: "1.0.0"

frontend:
  image:
    repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/dev-shopsphere-frontend
    tag: "1.0.0"
