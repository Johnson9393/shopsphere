global:
  environment: uat
  namespace: shopsphere-uat
  awsRegion: us-east-1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

services:
  productService:
    env:
      PRODUCT_DB_NAME: uat_products
      PRODUCT_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-product-service
      tag: "1.0.0"
  userService:
    env:
      USER_DB_NAME: uat_users
      USER_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-user-service
      tag: "1.0.0"
  cartService:
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-cart-service
      tag: "1.0.0"
  orderService:
    env:
      ORDER_DB_NAME: uat_orders
      ORDER_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-order-service
      tag: "1.0.0"
  paymentService:
    env:
      PAYMENT_DB_NAME: uat_payments
      PAYMENT_DB_SSLMODE: require
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-payment-service
      tag: "1.0.0"
  notificationService:
    image:
      repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-notification-service
      tag: "1.0.0"

apiGateway:
  image:
    repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-api-gateway
    tag: "1.0.0"

frontend:
  image:
    repository: 071138597726.dkr.ecr.us-east-1.amazonaws.com/uat-shopsphere-frontend
    tag: "1.0.0"
